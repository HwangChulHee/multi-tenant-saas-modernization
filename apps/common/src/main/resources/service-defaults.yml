server:
  port: ${SERVER_PORT}
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 15s
  task:
    scheduling:
      shutdown:
        await-termination: true
        await-termination-period: 12s

logging:
  structured:
    format:
      console: ecs

management:
  endpoints:
    access:
      default: none
  endpoint:
    health:
      access: read-only
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
          additional-path: server:/health
        readiness:
          additional-path: server:/ready

app:
  active-brands: ${ACTIVE_BRANDS}
