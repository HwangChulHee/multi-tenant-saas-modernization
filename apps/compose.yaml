name: multi-tenant-saas

x-app: &app
  stop_grace_period: 30s
  healthcheck:
    test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$$SERVER_PORT/ready"]
    interval: 5s
    timeout: 3s
    retries: 12
    start_period: 15s

x-sqs-env: &sqs-env
  SQS_ENDPOINT: ${SQS_ENDPOINT:?set SQS_ENDPOINT}
  AWS_REGION: ${AWS_REGION:?set AWS_REGION}
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  SQS_BRAND_A_QUEUE_URL: ${SQS_BRAND_A_QUEUE_URL:?set SQS_BRAND_A_QUEUE_URL}
  SQS_BRAND_B_QUEUE_URL: ${SQS_BRAND_B_QUEUE_URL:?set SQS_BRAND_B_QUEUE_URL}
  SQS_BRAND_C_QUEUE_URL: ${SQS_BRAND_C_QUEUE_URL:?set SQS_BRAND_C_QUEUE_URL}

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12

  migrate:
    image: postgres:17.6-alpine
    entrypoint: ["/bin/sh", "/migrations/migrate.sh"]
    environment:
      POSTGRES_HOST: postgres
      POS_DB_PASSWORD: ${POS_DB_PASSWORD:?set POS_DB_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      CATALOG_BRAND_A_PASSWORD: ${CATALOG_BRAND_A_PASSWORD:?set CATALOG_BRAND_A_PASSWORD}
      CATALOG_BRAND_B_PASSWORD: ${CATALOG_BRAND_B_PASSWORD:?set CATALOG_BRAND_B_PASSWORD}
      CATALOG_BRAND_C_PASSWORD: ${CATALOG_BRAND_C_PASSWORD:?set CATALOG_BRAND_C_PASSWORD}
      ORDER_BRAND_A_PASSWORD: ${ORDER_BRAND_A_PASSWORD:?set ORDER_BRAND_A_PASSWORD}
      ORDER_BRAND_B_PASSWORD: ${ORDER_BRAND_B_PASSWORD:?set ORDER_BRAND_B_PASSWORD}
      ORDER_BRAND_C_PASSWORD: ${ORDER_BRAND_C_PASSWORD:?set ORDER_BRAND_C_PASSWORD}
      WORKER_BRAND_A_PASSWORD: ${WORKER_BRAND_A_PASSWORD:?set WORKER_BRAND_A_PASSWORD}
      WORKER_BRAND_B_PASSWORD: ${WORKER_BRAND_B_PASSWORD:?set WORKER_BRAND_B_PASSWORD}
      WORKER_BRAND_C_PASSWORD: ${WORKER_BRAND_C_PASSWORD:?set WORKER_BRAND_C_PASSWORD}
    volumes:
      - ./db:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy

  localstack:
    image: localstack/localstack:4.12.0
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: ${AWS_REGION:?set AWS_REGION}
      LOCALSTACK_HOST: localstack:4566
      SQS_ENDPOINT_STRATEGY: path
      SQS_VISIBILITY_TIMEOUT: ${SQS_VISIBILITY_TIMEOUT:-8}
      SQS_MAX_RECEIVE_COUNT: ${SQS_MAX_RECEIVE_COUNT:-3}
    volumes:
      - ./localstack/init-sqs.sh:/etc/localstack/init/ready.d/10-sqs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "for brand in a b c; do awslocal sqs get-queue-url --queue-name brand-$$brand-orders >/dev/null || exit 1; done"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  catalog-api:
    <<: *app
    build:
      context: .
      args:
        SERVICE: catalog-api
    environment:
      DB_URL: ${DB_URL:?set DB_URL}
      DB_BRAND_A_PASSWORD: ${CATALOG_BRAND_A_PASSWORD:?set CATALOG_BRAND_A_PASSWORD}
      DB_BRAND_B_PASSWORD: ${CATALOG_BRAND_B_PASSWORD:?set CATALOG_BRAND_B_PASSWORD}
      DB_BRAND_C_PASSWORD: ${CATALOG_BRAND_C_PASSWORD:?set CATALOG_BRAND_C_PASSWORD}
      JWT_ISSUER: ${JWT_ISSUER:?set JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?set JWT_AUDIENCE}
      LOCAL_JWT_SECRET: ${LOCAL_JWT_SECRET:?generate LOCAL_JWT_SECRET}
      ACTIVE_BRANDS: ${ACTIVE_BRANDS:?set ACTIVE_BRANDS}
      SERVER_PORT: ${CATALOG_PORT:?set CATALOG_PORT}
    ports:
      - "127.0.0.1:${CATALOG_PORT}:${CATALOG_PORT}"
    depends_on:
      migrate:
        condition: service_completed_successfully

  order-api:
    <<: *app
    build:
      context: .
      args:
        SERVICE: order-api
    environment:
      <<: *sqs-env
      DB_URL: ${DB_URL:?set DB_URL}
      DB_BRAND_A_PASSWORD: ${ORDER_BRAND_A_PASSWORD:?set ORDER_BRAND_A_PASSWORD}
      DB_BRAND_B_PASSWORD: ${ORDER_BRAND_B_PASSWORD:?set ORDER_BRAND_B_PASSWORD}
      DB_BRAND_C_PASSWORD: ${ORDER_BRAND_C_PASSWORD:?set ORDER_BRAND_C_PASSWORD}
      JWT_ISSUER: ${JWT_ISSUER:?set JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?set JWT_AUDIENCE}
      LOCAL_JWT_SECRET: ${LOCAL_JWT_SECRET:?generate LOCAL_JWT_SECRET}
      ACTIVE_BRANDS: ${ACTIVE_BRANDS:?set ACTIVE_BRANDS}
      SERVER_PORT: ${ORDER_PORT:?set ORDER_PORT}
    ports:
      - "127.0.0.1:${ORDER_PORT}:${ORDER_PORT}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy

  fulfillment-worker:
    <<: *app
    build:
      context: .
      args:
        SERVICE: fulfillment-worker
    environment:
      <<: *sqs-env
      DB_URL: ${DB_URL:?set DB_URL}
      DB_BRAND_A_PASSWORD: ${WORKER_BRAND_A_PASSWORD:?set WORKER_BRAND_A_PASSWORD}
      DB_BRAND_B_PASSWORD: ${WORKER_BRAND_B_PASSWORD:?set WORKER_BRAND_B_PASSWORD}
      DB_BRAND_C_PASSWORD: ${WORKER_BRAND_C_PASSWORD:?set WORKER_BRAND_C_PASSWORD}
      ACTIVE_BRANDS: ${ACTIVE_BRANDS:?set ACTIVE_BRANDS}
      POS_URL: ${POS_URL:?set POS_URL}
      POS_SHARED_TOKEN: ${POS_SHARED_TOKEN:?generate POS_SHARED_TOKEN}
      POS_TIMEOUT_MS: ${POS_TIMEOUT_MS:-2500}
      SERVER_PORT: ${WORKER_PORT:?set WORKER_PORT}
    ports:
      - "127.0.0.1:${WORKER_PORT}:${WORKER_PORT}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy
      mock-pos:
        condition: service_healthy

  mock-pos:
    <<: *app
    build:
      context: .
      args:
        SERVICE: mock-pos
    environment:
      ACTIVE_BRANDS: ${ACTIVE_BRANDS:?set ACTIVE_BRANDS}
      SERVER_PORT: ${MOCK_POS_PORT:?set MOCK_POS_PORT}
      SPRING_DATASOURCE_URL: ${DB_URL:?set DB_URL}
      SPRING_DATASOURCE_USERNAME: mock_pos_app
      SPRING_DATASOURCE_PASSWORD: ${POS_DB_PASSWORD:?set POS_DB_PASSWORD}
      POS_SHARED_TOKEN: ${POS_SHARED_TOKEN:?generate POS_SHARED_TOKEN}
      POS_FAIL_FIRST: ${POS_FAIL_FIRST:-0}
      POS_DELAY_MS: ${POS_DELAY_MS:-0}
    ports:
      - "127.0.0.1:${MOCK_POS_PORT}:${MOCK_POS_PORT}"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
